<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="color-scheme" content="light">
  <title>Campus peak · Scale, balance, survive</title>
  <style>
    :root {
      --paper: #f3efe6;
      --paper-2: #e7e1d6;
      --card: #fffdf8;
      --ink: #1c1915;
      --muted: #5e574e;
      --faint: #8a8175;
      --line: #ddd4c6;
      --teal: #0f766e;
      --teal-deep: #115e59;
      --blue: #1e40af;
      --rust: #9a3412;
      --gold: #b45309;
      --serif: "Iowan Old Style", Palatino, "Palatino Linotype", Georgia, serif;
      --sans: "Avenir Next", "Segoe UI", sans-serif;
      color-scheme: light;
    }

    * { box-sizing: border-box; }
    [hidden] { display: none !important; }

    body {
      margin: 0;
      min-height: 100dvh;
      background:
        radial-gradient(900px 420px at 0% -10%, #fff 0%, transparent 55%),
        var(--paper);
      color: var(--ink);
      font-family: var(--sans);
      font-size: 18px;
      line-height: 1.5;
      padding-bottom: 7.5rem;
    }

    ::selection { background: #d5ebe4; }
    :focus-visible { outline: 2px solid var(--teal); outline-offset: 3px; }
    button, textarea, input, select { font: inherit; color: inherit; }
    button { cursor: pointer; }
    button:disabled { cursor: not-allowed; opacity: 0.45; }
    a { color: var(--teal-deep); }

    .top {
      position: sticky;
      top: 0;
      z-index: 3;
      background: rgba(243, 239, 230, 0.92);
      backdrop-filter: blur(12px);
      border-bottom: 1px solid var(--line);
    }
    .top-inner, .dock-inner {
      width: min(1040px, calc(100% - 2.5rem));
      margin: 0 auto;
    }
    .top-inner {
      display: flex;
      flex-wrap: wrap;
      align-items: center;
      justify-content: space-between;
      gap: 0.35rem 1.25rem;
      min-height: 4.4rem;
      padding: 0.7rem 0;
    }
    .kicker {
      margin: 0;
      font-size: 0.72rem;
      letter-spacing: 0.14em;
      text-transform: uppercase;
      font-weight: 600;
      color: var(--muted);
    }
    .name {
      margin: 0;
      font-family: var(--serif);
      font-size: 1.2rem;
      letter-spacing: -0.02em;
    }
    .status {
      display: flex;
      flex-wrap: wrap;
      align-items: center;
      justify-content: flex-end;
      gap: 0.75rem 1rem;
    }
    .phase {
      margin: 0;
      font-size: 0.72rem;
      font-weight: 700;
      letter-spacing: 0.14em;
      text-transform: uppercase;
      color: var(--teal-deep);
    }
    .steps {
      display: flex;
      gap: 0.3rem;
      list-style: none;
      padding: 0;
      margin: 0;
    }
    .steps li {
      font-size: 0.85rem;
      font-weight: 600;
      color: var(--faint);
      padding: 0.28rem 0.55rem;
      border-radius: 999px;
    }
    .steps li.now {
      color: var(--ink);
      background: var(--card);
      box-shadow: inset 0 0 0 1.5px var(--ink);
    }
    .steps li.done { color: var(--teal-deep); background: #e5f3ef; }

    #reset {
      background: none;
      border: 0;
      color: var(--muted);
      font-size: 0.9rem;
      font-weight: 600;
      padding: 0.35rem 0.2rem;
    }

    main {
      width: min(860px, calc(100% - 2.5rem));
      margin: 0 auto;
      padding: 1.6rem 0 1rem;
    }

    h1 {
      font-family: var(--serif);
      font-weight: 600;
      font-size: clamp(1.9rem, 4vw, 2.7rem);
      letter-spacing: -0.03em;
      line-height: 1.1;
      margin: 0 0 0.65rem;
      max-width: 16em;
    }
    h2 {
      font-family: var(--serif);
      font-size: 1.4rem;
      font-weight: 600;
      letter-spacing: -0.02em;
      margin: 0 0 0.4rem;
    }
    .lede {
      font-size: 1.12rem;
      line-height: 1.45;
      margin: 0 0 1.1rem;
      max-width: 40rem;
    }
    .aside {
      color: var(--muted);
      font-size: 0.98rem;
      margin: 0 0 1rem;
      max-width: 38rem;
    }
    .defs {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(180px, 1fr));
      gap: 0.65rem;
      margin: 0 0 1.25rem;
    }
    .def {
      background: var(--card);
      border: 1px solid var(--line);
      border-radius: 12px;
      padding: 0.7rem 0.85rem;
    }
    .def strong {
      display: block;
      font-size: 0.72rem;
      letter-spacing: 0.1em;
      text-transform: uppercase;
      color: var(--teal-deep);
      margin-bottom: 0.25rem;
    }
    .def span { font-size: 0.95rem; line-height: 1.35; }

    .panel {
      background: var(--card);
      border: 1px solid var(--line);
      border-radius: 16px;
      padding: 1rem 1.1rem 1.15rem;
      margin: 0 0 1rem;
    }
    .panel h2 { font-size: 1.2rem; }

    .choices {
      display: grid;
      gap: 0.65rem;
      margin: 0.85rem 0 0;
    }
    .choice {
      text-align: left;
      background: var(--paper);
      border: 1.5px solid var(--line);
      border-radius: 14px;
      padding: 0.85rem 1rem;
      transition: border-color 0.15s, background 0.15s;
    }
    .choice:hover { border-color: var(--teal); }
    .choice.selected {
      border-color: var(--teal-deep);
      background: #e5f3ef;
      box-shadow: inset 0 0 0 1px var(--teal-deep);
    }
    .choice .label {
      display: block;
      font-weight: 700;
      margin-bottom: 0.2rem;
    }
    .choice .hint {
      display: block;
      color: var(--muted);
      font-size: 0.95rem;
      line-height: 1.35;
    }

    .field {
      display: grid;
      gap: 0.35rem;
      margin: 0.75rem 0 0;
    }
    .field label {
      font-size: 0.78rem;
      font-weight: 700;
      letter-spacing: 0.08em;
      text-transform: uppercase;
      color: var(--muted);
    }
    .field select,
    .field textarea,
    .field input[type="number"] {
      background: var(--paper);
      border: 1.5px solid var(--line);
      border-radius: 10px;
      padding: 0.55rem 0.7rem;
      width: 100%;
      max-width: 28rem;
    }
    .field textarea { min-height: 5.5rem; resize: vertical; max-width: none; }
    .row {
      display: grid;
      grid-template-columns: repeat(3, minmax(0, 1fr));
      gap: 0.65rem;
    }
    @media (max-width: 640px) {
      .row { grid-template-columns: 1fr; }
    }

    .viz {
      background: #faf7f0;
      border: 1px solid var(--line);
      border-radius: 14px;
      padding: 0.75rem 0.85rem 0.55rem;
      margin: 0.9rem 0 0;
    }
    .viz-caption {
      display: flex;
      flex-wrap: wrap;
      justify-content: space-between;
      gap: 0.35rem 1rem;
      font-size: 0.88rem;
      color: var(--muted);
      margin-bottom: 0.35rem;
    }
    .viz svg { display: block; width: 100%; height: auto; }
    .toggle-row {
      display: flex;
      flex-wrap: wrap;
      align-items: center;
      gap: 0.75rem 1.25rem;
      margin-top: 0.75rem;
    }
    .toggle {
      display: inline-flex;
      align-items: center;
      gap: 0.5rem;
      font-size: 0.98rem;
      font-weight: 600;
    }
    .toggle input { width: 1.05rem; height: 1.05rem; accent-color: var(--teal); }

    .arch {
      display: flex;
      flex-wrap: wrap;
      align-items: center;
      justify-content: center;
      gap: 0.45rem 0.55rem;
      margin: 0.85rem 0 0.25rem;
      font-size: 0.92rem;
      font-weight: 600;
    }
    .node {
      background: var(--card);
      border: 1.5px solid var(--ink);
      border-radius: 10px;
      padding: 0.45rem 0.7rem;
      min-width: 4.5rem;
      text-align: center;
    }
    .node.lb { background: #e0edfa; border-color: var(--blue); color: var(--blue); }
    .node.ok { background: #e5f3ef; border-color: var(--teal-deep); color: var(--teal-deep); }
    .node.bad { background: #fce8e0; border-color: var(--rust); color: var(--rust); text-decoration: line-through; }
    .node.clients { border-style: dashed; color: var(--muted); border-color: var(--muted); }
    .arrow { color: var(--faint); font-weight: 400; }

    .summary {
      list-style: none;
      padding: 0;
      margin: 0.5rem 0 0;
    }
    .summary li {
      padding: 0.65rem 0;
      border-top: 1px solid var(--line);
    }
    .summary li:first-child { border-top: 0; }
    .summary .q {
      font-size: 0.75rem;
      font-weight: 700;
      letter-spacing: 0.1em;
      text-transform: uppercase;
      color: var(--muted);
      margin: 0 0 0.2rem;
    }
    .summary .a { margin: 0; font-size: 1.05rem; }

    .reveal-box {
      margin-top: 1rem;
      padding: 1rem 1.1rem;
      background: #e5f3ef;
      border: 1px solid #b7d9d1;
      border-radius: 14px;
    }
    .reveal-box h2 { color: var(--teal-deep); }
    .reveal-box ul { margin: 0.4rem 0 0; padding-left: 1.15rem; }
    .reveal-box li { margin: 0.3rem 0; }

    .dock {
      position: fixed;
      left: 0;
      right: 0;
      bottom: 0;
      z-index: 4;
      background: rgba(243, 239, 230, 0.96);
      backdrop-filter: blur(12px);
      border-top: 1px solid var(--line);
      padding: 0.85rem 0 calc(0.85rem + env(safe-area-inset-bottom));
    }
    .dock-inner {
      display: flex;
      flex-wrap: wrap;
      align-items: center;
      justify-content: space-between;
      gap: 0.65rem 1rem;
    }
    .hint-dock {
      margin: 0;
      color: var(--muted);
      font-size: 0.95rem;
      max-width: 28rem;
    }
    .nav {
      display: flex;
      gap: 0.5rem;
    }
    .btn {
      border-radius: 999px;
      padding: 0.55rem 1.15rem;
      font-weight: 700;
      border: 1.5px solid var(--ink);
      background: var(--card);
    }
    .btn.primary {
      background: var(--ink);
      color: #fff;
      border-color: var(--ink);
    }
    .btn.primary:hover:not(:disabled) { background: var(--teal-deep); border-color: var(--teal-deep); }
  </style>
</head>
<body>
  <header class="top">
    <div class="top-inner">
      <div>
        <p class="kicker">Cloud Computing · Week 2 · Apply</p>
        <p class="name">Campus peak · Scale, balance, survive</p>
      </div>
      <div class="status">
        <p class="phase" id="phaseLabel">Scenario</p>
        <ol class="steps" id="stepRail" aria-label="Progress"></ol>
        <button type="button" id="reset">Reset</button>
      </div>
    </div>
  </header>

  <main id="main"></main>

  <footer class="dock">
    <div class="dock-inner">
      <p class="hint-dock" id="dockHint">Pairs · ~18 minutes · one scenario</p>
      <div class="nav">
        <button type="button" class="btn" id="backBtn">Back</button>
        <button type="button" class="btn primary" id="nextBtn">Next</button>
      </div>
    </div>
  </footer>

  <script>
    const STEPS = [
      { id: "scenario", label: "1", phase: "Scenario", hint: "Read the peak together · ~2 min" },
      { id: "scale", label: "2", phase: "Scale", hint: "Pick vertical or horizontal · ~3 min" },
      { id: "lb", label: "3", phase: "LB & health", hint: "Place the LB and define /health · ~4 min" },
      { id: "asg", label: "4", phase: "Autoscaling", hint: "Metric, capacity band, cooldown · ~5 min" },
      { id: "risk", label: "5", phase: "Risk", hint: "Name one real risk · ~2 min" },
      { id: "reveal", label: "6", phase: "Reveal", hint: "Compare to a reasonable answer · ~3 min" },
    ];

    const state = {
      step: 0,
      scale: null,
      health: null,
      metric: "cpu",
      min: 1,
      desired: 2,
      max: 4,
      cooldown: 120,
      failOne: false,
      risk: "",
      riskPick: null,
    };

    const RISK_OPTIONS = [
      {
        id: "sticky",
        label: "Sticky sessions / local state",
        hint: "Users stick to one instance; scale-out does not help, and a failed node loses sessions.",
      },
      {
        id: "db",
        label: "Single database writer",
        hint: "You scaled the web tier; the DB becomes the bottleneck under the registration peak.",
      },
      {
        id: "thrash",
        label: "Thrashing autoscaling",
        hint: "No cooldown / noisy metric → instances flap; cost and instability rise.",
      },
      {
        id: "cost",
        label: "Max capacity / cost",
        hint: "max is too high (surprise bill) or too low (users still queue out).",
      },
    ];

    const main = document.getElementById("main");
    const stepRail = document.getElementById("stepRail");
    const phaseLabel = document.getElementById("phaseLabel");
    const dockHint = document.getElementById("dockHint");
    const backBtn = document.getElementById("backBtn");
    const nextBtn = document.getElementById("nextBtn");
    const resetBtn = document.getElementById("reset");

    function clampCapacity() {
      let { min, desired, max } = state;
      min = Math.max(1, Math.min(8, Number(min) || 1));
      max = Math.max(min, Math.min(12, Number(max) || min));
      desired = Math.max(min, Math.min(max, Number(desired) || min));
      state.min = min;
      state.max = max;
      state.desired = desired;
    }

    function demandAt(t) {
      // Registration opens mid-window: quiet → sharp peak → settle
      const open = 0.38;
      const peak = Math.exp(-Math.pow((t - open - 0.12) / 0.09, 2)) * 0.92;
      const base = 0.12 + 0.08 * Math.sin(t * Math.PI * 2);
      return Math.min(1, Math.max(0, base + peak));
    }

    function capacityUnits() {
      clampCapacity();
      return state.desired;
    }

    function renderDemandSvg() {
      const W = 640, H = 160, pad = 12;
      const n = 64;
      const units = capacityUnits();
      const capY = (1 - Math.min(1, units / 6)) * (H - 2 * pad) + pad;
      let demandPath = "";
      let capPath = "";
      for (let i = 0; i <= n; i++) {
        const t = i / n;
        const x = pad + t * (W - 2 * pad);
        const d = demandAt(t);
        const y = pad + (1 - d) * (H - 2 * pad);
        demandPath += (i === 0 ? "M" : "L") + x.toFixed(1) + "," + y.toFixed(1);
        capPath += (i === 0 ? "M" : "L") + x.toFixed(1) + "," + capY.toFixed(1);
      }
      const under = units < 3 ? "Under peak, capacity may lag demand." : "Capacity band covers more of the peak.";
      return `
        <div class="viz" aria-hidden="true">
          <div class="viz-caption">
            <span>Demand (registrations) vs capacity (instances × throughput)</span>
            <span>${units} instance${units === 1 ? "" : "s"} at desired</span>
          </div>
          <svg viewBox="0 0 ${W} ${H}" role="img">
            <rect x="0" y="0" width="${W}" height="${H}" fill="transparent"/>
            <path d="${demandPath}" fill="none" stroke="#9a3412" stroke-width="2.5"/>
            <path d="${capPath}" fill="none" stroke="#0f766e" stroke-width="2.5" stroke-dasharray="6 5"/>
            <text x="${pad}" y="${H - 2}" fill="#8a8175" font-size="11" font-family="var(--sans)">time → registration opens</text>
          </svg>
          <p class="aside" style="margin:0.25rem 0 0.15rem">${under}</p>
        </div>`;
    }

    function renderArch() {
      const fail = state.failOne;
      const n = Math.max(1, capacityUnits());
      const nodes = [];
      for (let i = 0; i < Math.min(n, 5); i++) {
        const bad = fail && i === 0;
        nodes.push(`<span class="node ${bad ? "bad" : "ok"}">Inst ${i + 1}${bad ? " ✕" : ""}</span>`);
      }
      if (n > 5) nodes.push(`<span class="node ok">+${n - 5}</span>`);
      return `
        <div class="arch" aria-hidden="true">
          <span class="node clients">Clients</span>
          <span class="arrow">→</span>
          <span class="node lb">Load balancer</span>
          <span class="arrow">→</span>
          ${nodes.join('<span class="arrow"> </span>')}
        </div>
        <p class="aside" style="margin-top:0.35rem;text-align:center">
          ${fail
            ? "Health check failed on Inst 1 — LB stops sending it traffic."
            : "All registered targets healthy — LB spreads requests."}
        </p>`;
    }

    function canAdvance() {
      const id = STEPS[state.step].id;
      if (id === "scale") return !!state.scale;
      if (id === "lb") return !!state.health;
      if (id === "asg") {
        clampCapacity();
        return state.min >= 1 && state.max >= state.min && state.desired >= state.min && state.desired <= state.max;
      }
      if (id === "risk") return !!(state.riskPick || state.risk.trim());
      return true;
    }

    function escapeHtml(s) {
      return String(s)
        .replace(/&/g, "&amp;")
        .replace(/</g, "&lt;")
        .replace(/>/g, "&gt;")
        .replace(/"/g, "&quot;");
    }

    function scaleLabel() {
      if (state.scale === "horizontal") return "Horizontal scale-out (more identical instances)";
      if (state.scale === "vertical") return "Vertical scale-up (bigger single instance)";
      return "—";
    }

    function healthLabel() {
      const map = {
        process: "Process up (port answers) — weak: app may be wedged",
        http: "HTTP 200 on /health — app responds",
        ready: "Ready for traffic (deps OK) — stronger for registration",
      };
      return map[state.health] || "—";
    }

    function metricLabel() {
      const map = {
        cpu: "CPU utilization",
        rps: "Request count / RPS at the LB",
        latency: "p95 latency",
      };
      return map[state.metric] || state.metric;
    }

    function riskLabel() {
      const found = RISK_OPTIONS.find((r) => r.id === state.riskPick);
      if (found) return found.label;
      const custom = state.risk.trim();
      return custom ? escapeHtml(custom) : "—";
    }

    function renderStep() {
      const step = STEPS[state.step];
      phaseLabel.textContent = step.phase;
      dockHint.textContent = step.hint;
      backBtn.disabled = state.step === 0;
      nextBtn.textContent = state.step === STEPS.length - 1 ? "Done" : "Next";
      nextBtn.disabled = state.step === STEPS.length - 1 ? false : !canAdvance();

      stepRail.innerHTML = STEPS.map((s, i) => {
        const cls = i === state.step ? "now" : i < state.step ? "done" : "";
        return `<li class="${cls}" aria-current="${i === state.step ? "step" : "false"}">${s.label}</li>`;
      }).join("");

      let html = "";

      if (step.id === "scenario") {
        html = `
          <h1>Registration opens. Everyone hits refresh.</h1>
          <p class="lede">
            Your campus event app sells limited tickets. At 12:00 the form goes live.
            Request rate spikes for about twenty minutes, then falls. One small VM
            already timed out last year.
          </p>
          <div class="defs">
            <div class="def"><strong>Scalability</strong><span>Can you handle more load by adding resources?</span></div>
            <div class="def"><strong>Elasticity</strong><span>Do you adapt capacity as demand changes?</span></div>
            <div class="def"><strong>Availability</strong><span>Do users still get a response when a node fails?</span></div>
          </div>
          ${renderDemandSvg()}
          <p class="aside">Teal dashed line = capacity at your later “desired” count (starts at 2). Rust = demand.</p>
          <p class="aside">This lab applies Week 2 — pick a design, then compare to a reasonable answer. The AWS demo stays on the lecture slides.</p>`;
      }

      if (step.id === "scale") {
        html = `
          <h1>How will you add capacity?</h1>
          <p class="lede">Same peak. Prefer a strategy you can defend in one sentence.</p>
          <div class="choices" role="group" aria-label="Scaling strategy">
            <button type="button" class="choice ${state.scale === "vertical" ? "selected" : ""}" data-scale="vertical">
              <span class="label">Vertical — scale up</span>
              <span class="hint">Bigger CPU/RAM on one instance. Simple until you hit a machine limit or a single point of failure.</span>
            </button>
            <button type="button" class="choice ${state.scale === "horizontal" ? "selected" : ""}" data-scale="horizontal">
              <span class="label">Horizontal — scale out</span>
              <span class="hint">More identical instances behind a load balancer. Needs disposable, preferably stateless replicas.</span>
            </button>
          </div>
          <p class="aside" style="margin-top:1rem">Trap: sessions on local disk, sticky affinity, or a single DB writer can make “more instances” look like it works — until it does not.</p>`;
      }

      if (step.id === "lb") {
        html = `
          <h1>Put a load balancer in front — and define healthy.</h1>
          <p class="lede">Without health checks, redundancy is decoration: the LB keeps sending traffic to a dead target.</p>
          ${renderArch()}
          <div class="toggle-row">
            <label class="toggle">
              <input type="checkbox" id="failOne" ${state.failOne ? "checked" : ""}>
              Fail health on instance 1
            </label>
          </div>
          <div class="panel" style="margin-top:1rem">
            <h2>What should <code>/health</code> mean?</h2>
            <div class="choices" role="group" aria-label="Health check meaning">
              <button type="button" class="choice ${state.health === "process" ? "selected" : ""}" data-health="process">
                <span class="label">Process listening</span>
                <span class="hint">Port is open. Fast, but a wedged app still looks “up”.</span>
              </button>
              <button type="button" class="choice ${state.health === "http" ? "selected" : ""}" data-health="http">
                <span class="label">HTTP 200 on /health</span>
                <span class="hint">The app answers. Good baseline for the demo.</span>
              </button>
              <button type="button" class="choice ${state.health === "ready" ? "selected" : ""}" data-health="ready">
                <span class="label">Ready for traffic</span>
                <span class="hint">App + critical deps (e.g. DB reachable). Stronger for registration.</span>
              </button>
            </div>
          </div>`;
      }

      if (step.id === "asg") {
        clampCapacity();
        html = `
          <h1>Sketch the autoscaling policy</h1>
          <p class="lede">Control loop: observe → decide → act. Set a metric, a capacity band, and a cooldown so you do not thrash.</p>
          <div class="panel">
            <div class="field">
              <label for="metric">Metric</label>
              <select id="metric">
                <option value="cpu" ${state.metric === "cpu" ? "selected" : ""}>CPU utilization</option>
                <option value="rps" ${state.metric === "rps" ? "selected" : ""}>Request count / RPS</option>
                <option value="latency" ${state.metric === "latency" ? "selected" : ""}>p95 latency</option>
              </select>
            </div>
            <div class="row">
              <div class="field">
                <label for="minCap">Min</label>
                <input type="number" id="minCap" min="1" max="8" value="${state.min}">
              </div>
              <div class="field">
                <label for="desCap">Desired</label>
                <input type="number" id="desCap" min="1" max="12" value="${state.desired}">
              </div>
              <div class="field">
                <label for="maxCap">Max</label>
                <input type="number" id="maxCap" min="1" max="12" value="${state.max}">
              </div>
            </div>
            <div class="field">
              <label for="cooldown">Cooldown (seconds)</label>
              <input type="number" id="cooldown" min="0" max="600" step="30" value="${state.cooldown}">
            </div>
          </div>
          ${renderDemandSvg()}
          <p class="aside">CPU is a weak proxy if the app is I/O-bound waiting on the ticket DB. RPS or latency often track user pain better at registration open.</p>`;
      }

      if (step.id === "risk") {
        html = `
          <h1>Name one risk in your design</h1>
          <p class="lede">Pick the failure mode most likely to bite during the twenty-minute peak — or write your own.</p>
          <div class="choices" role="group" aria-label="Risk">
            ${RISK_OPTIONS.map((r) => `
              <button type="button" class="choice ${state.riskPick === r.id ? "selected" : ""}" data-risk="${r.id}">
                <span class="label">${r.label}</span>
                <span class="hint">${r.hint}</span>
              </button>`).join("")}
          </div>
          <div class="field">
            <label for="riskText">Or your own (optional)</label>
            <textarea id="riskText" placeholder="One sentence…">${escapeHtml(state.risk)}</textarea>
          </div>`;
      }

      if (step.id === "reveal") {
        html = `
          <h1>Your design at a glance</h1>
          <p class="lede">Hold this up against a reasonable answer — not the only answer.</p>
          <div class="panel">
            <ul class="summary">
              <li><p class="q">Scale</p><p class="a">${scaleLabel()}</p></li>
              <li><p class="q">Health check</p><p class="a">${healthLabel()}</p></li>
              <li><p class="q">Autoscaling</p><p class="a">${metricLabel()} · min ${state.min} / desired ${state.desired} / max ${state.max} · cooldown ${state.cooldown}s</p></li>
              <li><p class="q">Risk</p><p class="a">${riskLabel()}</p></li>
            </ul>
          </div>
          ${renderArch()}
          <div class="reveal-box">
            <h2>Possible answer (reasonable, not unique)</h2>
            <ul>
              <li><strong>Horizontal</strong> scale-out of a stateless web tier behind a load balancer.</li>
              <li><strong>/health</strong> returns ready when the app can take registrations (deps checked), not only “port open”.</li>
              <li><strong>Policy:</strong> RPS or latency at the LB; min 2 (survive one failure), desired 2, max capped for cost; cooldown so the peak does not flap instances.</li>
              <li><strong>Watch:</strong> the ticket database — scaling web instances alone will not save a single writer under peak.</li>
            </ul>
            <p class="aside" style="margin:0.75rem 0 0">Five ideas from the lecture: scalability ≠ elasticity; scale-out needs disposable replicas + LB; health checks turn redundancy into availability; autoscaling is a control loop with a cost cap; cloud APIs make pooled capacity on-demand.</p>
          </div>`;
      }

      main.innerHTML = html;
      bindStepHandlers();
    }

    function bindStepHandlers() {
      main.querySelectorAll("[data-scale]").forEach((btn) => {
        btn.addEventListener("click", () => {
          state.scale = btn.getAttribute("data-scale");
          renderStep();
        });
      });
      main.querySelectorAll("[data-health]").forEach((btn) => {
        btn.addEventListener("click", () => {
          state.health = btn.getAttribute("data-health");
          renderStep();
        });
      });
      main.querySelectorAll("[data-risk]").forEach((btn) => {
        btn.addEventListener("click", () => {
          state.riskPick = btn.getAttribute("data-risk");
          renderStep();
        });
      });
      const fail = document.getElementById("failOne");
      if (fail) {
        fail.addEventListener("change", () => {
          state.failOne = fail.checked;
          renderStep();
        });
      }
      const metric = document.getElementById("metric");
      if (metric) {
        metric.addEventListener("change", () => {
          state.metric = metric.value;
          renderStep();
        });
      }
      ["minCap", "desCap", "maxCap", "cooldown"].forEach((id) => {
        const el = document.getElementById(id);
        if (!el) return;
        el.addEventListener("change", () => {
          if (id === "minCap") state.min = el.value;
          if (id === "desCap") state.desired = el.value;
          if (id === "maxCap") state.max = el.value;
          if (id === "cooldown") state.cooldown = Number(el.value) || 0;
          clampCapacity();
          renderStep();
        });
      });
      const riskText = document.getElementById("riskText");
      if (riskText) {
        riskText.addEventListener("input", () => {
          state.risk = riskText.value;
          nextBtn.disabled = !canAdvance();
        });
      }
    }

    backBtn.addEventListener("click", () => {
      if (state.step > 0) {
        state.step -= 1;
        renderStep();
        window.scrollTo({ top: 0, behavior: "smooth" });
      }
    });

    nextBtn.addEventListener("click", () => {
      if (state.step >= STEPS.length - 1) return;
      if (!canAdvance()) return;
      state.step += 1;
      renderStep();
      window.scrollTo({ top: 0, behavior: "smooth" });
    });

    resetBtn.addEventListener("click", () => {
      state.step = 0;
      state.scale = null;
      state.health = null;
      state.metric = "cpu";
      state.min = 1;
      state.desired = 2;
      state.max = 4;
      state.cooldown = 120;
      state.failOne = false;
      state.risk = "";
      state.riskPick = null;
      renderStep();
      window.scrollTo({ top: 0, behavior: "smooth" });
    });

    renderStep();
  </script>
</body>
</html>
